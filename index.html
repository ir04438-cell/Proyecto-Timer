<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Temporizador de circuitos</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1f2329;
    --line: #333a44;
    --text: #f3f5f7;
    --muted: #9aa4b1;
    --accent: #2fbf71;
    --prep: #c98a00;
    --work: #14854a;
    --rest: #1c5fb8;
    --round: #6b3fb5;
    --done: #14161a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .25s;
  }
  body[data-phase="prep"]  { background: var(--prep); }
  body[data-phase="work"]  { background: var(--work); }
  body[data-phase="rest"]  { background: var(--rest); }
  body[data-phase="round"] { background: var(--round); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  [hidden] { display: none !important; }

  /* ---------- Configuración ---------- */
  #setup {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .presets button {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font-size: .9rem;
  }
  .field {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .field label { flex: 1; }
  .field small { display: block; color: var(--muted); font-size: .78rem; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 10px;
    background: #2b313a; font-size: 1.4rem; line-height: 1;
  }
  .stepper button:active { background: #3a424e; }
  .stepper input {
    width: 64px; height: 44px; text-align: center;
    background: transparent; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 1.15rem; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  details { background: var(--panel); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  summary { cursor: pointer; }
  textarea {
    width: 100%; margin-top: 10px; min-height: 120px; resize: vertical;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit;
  }
  .toggles { display: flex; gap: 20px; padding: 10px 4px; color: var(--muted); }
  .toggles label { display: flex; align-items: center; gap: 8px; }
  .toggles input { width: 20px; height: 20px; accent-color: var(--accent); }
  .total { text-align: center; color: var(--muted); margin: 14px 0; }
  .total b { color: var(--text); font-variant-numeric: tabular-nums; }
  .primary {
    width: 100%; padding: 18px; border-radius: 14px;
    background: var(--accent); color: #06230f; font-size: 1.25rem; font-weight: 700;
  }

  /* ---------- Temporizador ---------- */
  #timer {
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .topline {
    width: 100%; display: flex; justify-content: space-between;
    font-size: 1.05rem; font-variant-numeric: tabular-nums; opacity: .9;
  }
  .bar { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; width: 100%; }
  #phase { font-size: clamp(1.6rem, 7vw, 3rem); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  #clock {
    font-size: min(42vw, 46vh); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; margin: .05em 0;
  }
  #clock.long { font-size: min(30vw, 40vh); }
  #name { font-size: clamp(1.3rem, 6vw, 2.4rem); font-weight: 600; overflow-wrap: anywhere; }
  #next { font-size: clamp(1rem, 4.2vw, 1.4rem); opacity: .85; margin-top: 8px; min-height: 1.4em; }
  .controls { display: flex; gap: 10px; width: 100%; max-width: 520px; }
  .controls button {
    flex: 1; padding: 16px 6px; border-radius: 14px;
    background: rgba(0,0,0,.28); font-size: 1.05rem; font-weight: 600;
  }
  .controls button:active { background: rgba(0,0,0,.42); }
  .controls #pause { flex: 1.6; background: rgba(255,255,255,.92); color: #111; }
</style>
</head>
<body>

<main id="setup">
  <h1>Temporizador de circuitos</h1>

  <div class="presets">
    <button data-preset="30,15,8,3,60">Circuito 30/15</button>
    <button data-preset="20,10,8,1,0">Tabata 20/10</button>
    <button data-preset="45,15,6,4,90">HIIT 45/15</button>
    <button data-preset="60,0,5,5,60">EMOM 5×5</button>
  </div>

  <div class="field">
    <label for="work">Trabajo<small>segundos por ejercicio</small></label>
    <div class="stepper"><button data-step="-5" data-for="work" aria-label="Menos trabajo">−</button><input id="work" type="number" inputmode="numeric" min="1" max="3600"><button data-step="5" data-for="work" aria-label="Más trabajo">+</button></div>
  </div>
  <div class="field">
    <label for="rest">Descanso<small>segundos entre ejercicios</small></label>
    <div class="stepper"><button data-step="-5" data-for="rest" aria-label="Menos descanso">−</button><input id="rest" type="number" inputmode="numeric" min="0" max="3600"><button data-step="5" data-for="rest" aria-label="Más descanso">+</button></div>
  </div>
  <div class="field">
    <label for="exercises">Ejercicios<small>estaciones por ronda</small></label>
    <div class="stepper"><button data-step="-1" data-for="exercises" aria-label="Menos ejercicios">−</button><input id="exercises" type="number" inputmode="numeric" min="1" max="99"><button data-step="1" data-for="exercises" aria-label="Más ejercicios">+</button></div>
  </div>
  <div class="field">
    <label for="rounds">Rondas<small>vueltas al circuito</small></label>
    <div class="stepper"><button data-step="-1" data-for="rounds" aria-label="Menos rondas">−</button><input id="rounds" type="number" inputmode="numeric" min="1" max="99"><button data-step="1" data-for="rounds" aria-label="Más rondas">+</button></div>
  </div>
  <div class="field">
    <label for="roundRest">Descanso entre rondas<small>segundos</small></label>
    <div class="stepper"><button data-step="-5" data-for="roundRest" aria-label="Menos descanso entre rondas">−</button><input id="roundRest" type="number" inputmode="numeric" min="0" max="3600"><button data-step="5" data-for="roundRest" aria-label="Más descanso entre rondas">+</button></div>
  </div>
  <div class="field">
    <label for="prep">Preparación<small>cuenta atrás inicial</small></label>
    <div class="stepper"><button data-step="-5" data-for="prep" aria-label="Menos preparación">−</button><input id="prep" type="number" inputmode="numeric" min="0" max="600"><button data-step="5" data-for="prep" aria-label="Más preparación">+</button></div>
  </div>

  <details>
    <summary>Nombres de los ejercicios (opcional)</summary>
    <textarea id="names" placeholder="Uno por línea, en orden:&#10;Sentadillas&#10;Flexiones&#10;Burpees"></textarea>
  </details>

  <div class="toggles">
    <label><input id="sound" type="checkbox"> Sonido</label>
    <label><input id="vibrate" type="checkbox"> Vibración</label>
  </div>

  <p class="total">Duración total: <b id="total">0:00</b></p>
  <button class="primary" id="start">Empezar</button>
</main>

<main id="timer" hidden>
  <div class="topline"><span id="pos"></span><span id="left"></span></div>
  <div class="bar"><i id="progress"></i></div>
  <div class="center">
    <div id="phase"></div>
    <div id="clock">0</div>
    <div id="name"></div>
    <div id="next"></div>
  </div>
  <div class="controls">
    <button id="stop">Salir</button>
    <button id="pause">Pausa</button>
    <button id="skip">Saltar ⏭</button>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const FIELDS = ['work', 'rest', 'exercises', 'rounds', 'roundRest', 'prep'];
  const DEFAULTS = { work: 30, rest: 15, exercises: 8, rounds: 3, roundRest: 60, prep: 10, names: '', sound: true, vibrate: true };
  const STORE = 'circuit-timer-v1';
  const LABEL = { prep: 'Prepárate', work: 'Trabajo', rest: 'Descanso', round: 'Descanso de ronda' };

  // ---------- Configuración ----------
  let cfg = { ...DEFAULTS };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch {}

  function clampField(id, v) {
    const el = $(id);
    v = Math.round(Number(v));
    if (!Number.isFinite(v)) v = DEFAULTS[id];
    return Math.min(Number(el.max), Math.max(Number(el.min), v));
  }
  function readCfg() {
    for (const id of FIELDS) cfg[id] = clampField(id, $(id).value);
    cfg.names = $('names').value;
    cfg.sound = $('sound').checked;
    cfg.vibrate = $('vibrate').checked;
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch {}
  }
  function writeCfg() {
    for (const id of FIELDS) $(id).value = cfg[id];
    $('names').value = cfg.names;
    $('sound').checked = cfg.sound;
    $('vibrate').checked = cfg.vibrate;
  }

  function buildSequence() {
    const names = cfg.names.split('\n').map(s => s.trim()).filter(Boolean);
    const nameOf = e => names[e - 1] || `Ejercicio ${e}`;
    const seq = [];
    if (cfg.prep > 0) seq.push({ type: 'prep', dur: cfg.prep, ex: 1, round: 1, name: nameOf(1) });
    for (let r = 1; r <= cfg.rounds; r++) {
      for (let e = 1; e <= cfg.exercises; e++) {
        seq.push({ type: 'work', dur: cfg.work, ex: e, round: r, name: nameOf(e) });
        if (e < cfg.exercises) {
          if (cfg.rest > 0) seq.push({ type: 'rest', dur: cfg.rest, ex: e + 1, round: r, name: nameOf(e + 1) });
        } else if (r < cfg.rounds) {
          if (cfg.roundRest > 0) seq.push({ type: 'round', dur: cfg.roundRest, ex: 1, round: r + 1, name: nameOf(1) });
          else if (cfg.rest > 0) seq.push({ type: 'rest', dur: cfg.rest, ex: 1, round: r + 1, name: nameOf(1) });
        }
      }
    }
    return seq;
  }

  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  function refreshSetup() {
    readCfg();
    $('total').textContent = fmt(buildSequence().reduce((a, p) => a + p.dur, 0));
  }

  document.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', () => {
    const el = $(b.dataset.for);
    el.value = clampField(el.id, Number(el.value) + Number(b.dataset.step));
    refreshSetup();
  }));
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    const [work, rest, exercises, rounds, roundRest] = b.dataset.preset.split(',').map(Number);
    Object.assign(cfg, { work, rest, exercises, rounds, roundRest });
    writeCfg();
    refreshSetup();
  }));
  $('setup').addEventListener('input', refreshSetup);
  FIELDS.forEach(id => $(id).addEventListener('blur', () => { $(id).value = clampField(id, $(id).value); }));

  // ---------- Sonido, vibración, pantalla encendida ----------
  let audio = null;
  function beep(freq, ms, when = 0) {
    if (!cfg.sound || !audio) return;
    const t = audio.currentTime + when;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
    gain.gain.setValueAtTime(0.35, t + ms / 1000 - 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + ms / 1000 + 0.02);
  }
  function buzz(pattern) {
    if (cfg.vibrate && navigator.vibrate) navigator.vibrate(pattern);
  }
  function cue(kind) {
    if (kind === 'tick') { beep(660, 120); buzz(60); }
    else if (kind === 'work') { beep(1175, 600); buzz(500); }
    else if (kind === 'rest') { beep(440, 600); buzz([200, 100, 200]); }
    else if (kind === 'done') { beep(880, 250); beep(880, 250, 0.35); beep(1320, 700, 0.7); buzz([300, 150, 300, 150, 600]); }
  }

  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
      }
    } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && active) { keepAwake(true); tick(); }
  });

  // ---------- Motor del temporizador ----------
  let seq = [], idx = 0, active = false, paused = false, finished = false;
  let phaseEnd = 0;     // instante (ms) en que acaba la fase actual
  let pausedLeft = 0;   // ms restantes al pausar
  let lastShown = -1, interval = null, totalMs = 0;

  function remainingAfter(i) {
    let s = 0;
    for (let k = i + 1; k < seq.length; k++) s += seq[k].dur;
    return s * 1000;
  }

  function enterPhase(i, startAt, silent) {
    idx = i;
    phaseEnd = startAt + seq[i].dur * 1000;
    lastShown = -1;
    const p = seq[i];
    document.body.dataset.phase = p.type;
    $('phase').textContent = LABEL[p.type];
    $('pos').textContent = `Ronda ${p.round}/${cfg.rounds} · Ejercicio ${p.ex}/${cfg.exercises}`;
    if (p.type === 'work') {
      $('name').textContent = p.name;
      const n = seq[i + 1];
      $('next').textContent = !n ? 'Último ejercicio' : n.type === 'work' ? `Siguiente: ${n.name}` : `Después: ${LABEL[n.type].toLowerCase()}`;
    } else {
      $('name').textContent = '';
      $('next').textContent = `Siguiente: ${p.name}`;
    }
    if (!silent && p.type !== 'prep') cue(p.type === 'work' ? 'work' : 'rest');
  }

  function finish() {
    finished = true;
    clearInterval(interval);
    keepAwake(false);
    document.body.dataset.phase = 'done';
    $('phase').textContent = '¡Terminado!';
    $('clock').textContent = '✓';
    $('clock').classList.remove('long');
    $('name').textContent = 'Buen trabajo';
    $('next').textContent = '';
    $('left').textContent = '0:00';
    $('progress').style.width = '100%';
    $('pause').textContent = 'Repetir';
    $('skip').hidden = true;
    cue('done');
  }

  function tick() {
    if (!active || paused || finished) return;
    const now = Date.now();
    // Avanza de fase; si la pestaña estuvo dormida puede saltar varias de golpe.
    let jumped = 0;
    while (now >= phaseEnd) {
      if (idx + 1 >= seq.length) return finish();
      enterPhase(idx + 1, phaseEnd, jumped++ > 0);
    }
    render(phaseEnd - now);
  }

  function render(ms) {
    const secs = Math.ceil(ms / 1000);
    const leftMs = ms + remainingAfter(idx);
    $('progress').style.width = `${100 * (1 - leftMs / totalMs)}%`;
    if (secs === lastShown) return;
    if (lastShown !== -1 && secs <= 3 && secs > 0 && !paused) cue('tick');
    lastShown = secs;
    $('clock').textContent = secs >= 60 ? fmt(secs) : secs;
    $('clock').classList.toggle('long', secs >= 60);
    $('left').textContent = `Quedan ${fmt(Math.ceil(leftMs / 1000))}`;
  }

  function start() {
    readCfg();
    writeCfg();
    seq = buildSequence();
    totalMs = seq.reduce((a, p) => a + p.dur, 0) * 1000;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
    } catch { audio = null; }
    active = true; paused = false; finished = false;
    $('setup').hidden = true;
    $('timer').hidden = false;
    $('skip').hidden = false;
    $('pause').textContent = 'Pausa';
    keepAwake(true);
    enterPhase(0, Date.now(), false);
    tick();
    clearInterval(interval);
    interval = setInterval(tick, 100);
  }

  function togglePause() {
    if (finished) return start();
    paused = !paused;
    if (paused) {
      pausedLeft = phaseEnd - Date.now();
      keepAwake(false);
    } else {
      phaseEnd = Date.now() + pausedLeft;
      keepAwake(true);
      tick();
    }
    $('pause').textContent = paused ? 'Continuar' : 'Pausa';
  }

  function skip() {
    if (finished) return;
    if (idx + 1 >= seq.length) return finish();
    enterPhase(idx + 1, Date.now(), paused);
    if (paused) { pausedLeft = seq[idx].dur * 1000; render(pausedLeft); }
    else tick();
  }

  function stop() {
    if (!finished && !confirm('¿Salir del entrenamiento?')) return;
    active = false;
    clearInterval(interval);
    keepAwake(false);
    delete document.body.dataset.phase;
    $('timer').hidden = true;
    $('setup').hidden = false;
  }

  $('start').addEventListener('click', start);
  $('pause').addEventListener('click', togglePause);
  $('skip').addEventListener('click', skip);
  $('stop').addEventListener('click', stop);
  document.addEventListener('keydown', e => {
    if (!active || e.target.matches('input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.code === 'ArrowRight') skip();
  });

  writeCfg();
  refreshSetup();
})();
</script>
</body>
</html>
